unbind C-b
set-option -g prefix M-t
bind-key M-t send-prefix

unbind v
unbind h 
unbind w
unbind x

set -g mouse on
set -g extended-keys on

bind-key v split-window -v -c "#{pane_current_path}"
bind-key b split-window -h -c "#{pane_current_path}"
bind-key x kill-pane
bind-key d kill-window
bind-key          , command-prompt "rename-window '%%'"

bind-key r source-file ~/.tmux.conf

# Quick screenshot with Alt+t then s (or Alt+t then Shift+s)
# Takes full desktop screenshot, saves it, and puts the WSL path on the clipboard.
# Then just Ctrl+Shift+V to paste the path. No manual Win+Shift+S needed.
bind-key s run-shell '~/.local/bin/take-screenshot'
bind-key S run-shell '~/.local/bin/take-screenshot'

# changing design
set -g status-style fg=white 
set -g status-style bold 
set -g status-left ""
set -g status-right ""
set -g window-status-current-format ' [#I:#W] '
set -g window-status-format '#I:#W'
set -g base-index 1
set -g renumber-windows on

# vim keybindings for panel hopping
bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix l select-pane -R

# Quick window ("tab") switching, no prefix needed: PageUp/PageDown jump
# left/right between tmux windows. Note: this means PageUp/PageDown no
# longer reach whatever app has focus (e.g. scrolling in vim/less) --
# they're claimed globally by tmux instead.
bind-key -n PageUp previous-window
bind-key -n PageDown next-window

# --- persistence across WSL shutdowns ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run '~/.tmux/plugins/tpm/tpm'

set -g status-right '#(cat ~/.cache/tmux-hw/volume 2>/dev/null) | #(cat ~/.cache/tmux-hw/battery 2>/dev/null) | #(TZ=America/Asuncion date +"%a %d %b %H:%M") | #(cat ~/.cache/tmux-hw/wifi 2>/dev/null)'
set -g status-right-length 200
set -g status-interval 1

# Voice dictation: Alt+V toggles record / transcribe-and-type
bind-key -n M-v run-shell -b "~/.claude/voice/dictate.sh '#{pane_id}'"
# Alt+S: stop current speech; again when silent = mute/unmute
bind-key -n M-s run-shell -b "~/.claude/voice/shush.sh"
# Alt+R: replay the last spoken output for this window
bind-key -n M-r run-shell -b "~/.claude/voice/repeat.sh '#{pane_id}'"
